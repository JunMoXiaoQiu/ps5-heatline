<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2027"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ea6ff"/>
      <stop offset="0.55" stop-color="#f1b44c"/>
      <stop offset="1" stop-color="#ff5a5a"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ea6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="3">
    <line x1="64" y1="152" x2="448" y2="152"/>
    <line x1="64" y1="232" x2="448" y2="232"/>
    <line x1="64" y1="312" x2="448" y2="312"/>
    <line x1="64" y1="392" x2="448" y2="392"/>
  </g>
  <!-- area under curve -->
  <path d="M64 372 L136 360 L184 330 L216 352 L262 250 L300 286 L344 186 L384 214 L432 132 L432 420 L64 420 Z" fill="url(#fill)"/>
  <!-- the heat line -->
  <polyline points="64,372 136,360 184,330 216,352 262,250 300,286 344,186 384,214 432,132"
            fill="none" stroke="url(#heat)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- live point -->
  <circle cx="432" cy="132" r="30" fill="#ff5a5a" opacity="0.25"/>
  <circle cx="432" cy="132" r="17" fill="#ffffff"/>
  <circle cx="432" cy="132" r="10" fill="#ff5a5a"/>
</svg>
